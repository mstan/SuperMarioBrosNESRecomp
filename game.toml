# game.toml — Super Mario Bros. (NES, Mapper 0 / NROM, 2 PRG banks, 1 CHR ROM bank)

[game]
output_prefix = "super-mario-bros"
symbol_file = "symbols.sym"

# SMB inline indexed dispatch: JSR $8E04 pops return address to find a
# 2-byte LE address table immediately after the JSR. Dispatches via A register.
[[inline_dispatch]]
addr = 0x8E04

[functions]
fixed = [
    # Previously known
    0xD969,  # EnemyStateDetermination — cross-function branch target

    # --- From SMBDIS.ASM (https://gist.github.com/1wErt3r/4048722) ---
    # JMP-only / dispatch-table-only targets not reachable via JSR chain.

    # Game mode & demo
    0x8233, 0x82BD, 0x82C2, 0x82DB, 0x838E, 0x8426, 0x9239, 0x9287, 0xAF27,
    # VRAM / PPU helpers
    0x85D9, 0x8653, 0x8660, 0x86DB, 0x8759, 0x8762, 0x8944, 0x89D1,
    # Level object rendering
    0x8F8A, 0x94AC, 0x9593, 0x9596, 0x9639, 0x963D, 0x97D4, 0x97DA,
    0x9A25, 0x9A4A, 0x9A5C, 0x9A80, 0x9A84, 0x9A9B, 0x9B5C, 0x9B6F,
    # Player control & physics
    0xAFB7, 0xB053, 0xB148, 0xB281, 0xB2CE, 0xB396, 0xB43A, 0xB5C8,
    0xB60E, 0xB67C, 0xB6DE, 0xB92C, 0xB9A9, 0xB9DA, 0xBB33, 0xBB48,
    0xC0D6, 0xE1AC, 0xE1DC, 0xE23E, 0xE329,
    # Player graphics
    0xF477, 0xF4B9, 0xF4C0, 0xF522, 0xF595, 0xF6DE,
    # Enemies: spawning & AI
    0xBC57, 0xBC9E, 0xBD35, 0xBD8C, 0xBE33, 0xBEDB, 0xC0FA, 0xC0FF,
    0xC101, 0xC11E, 0xC15D, 0xC268, 0xC3C1, 0xC3FD, 0xC408, 0xC40B,
    0xC4CE, 0xC923, 0xCAA7, 0xDE19, 0xDEAE, 0xE4E6, 0xE4E9, 0xEDFA,
    0xEE5B, 0xEE69, 0xEE7D, 0xEF97, 0xED76,
    # Collision / bounding box
    0xC516, 0xC518, 0xC724, 0xC8DC, 0xC9F0, 0xC9F2, 0xCA47, 0xCA4A,
    0xCA67, 0xCA81, 0xCC6B, 0xCC90, 0xCD2E, 0xCF37, 0xD079, 0xD0C7,
    0xD3D2, 0xD3FE, 0xD442, 0xD90F, 0xD93C, 0xD98A, 0xE094, 0xE57E,
    0xE65A, 0xE6E8, 0xE7B1, 0xE7B3, 0xE83F,
    # Fireball / flame / gfx
    0xC81A, 0xD410, 0xF118, 0xF144, 0xF38C,
    # Platform / objects
    0xD61A, 0xD7A9, 0xD804, 0xD835, 0xD89F, 0xD8C4, 0xDB3C, 0xDB88,
    0xDD56, 0xDD5C, 0xDD66, 0xE1B2, 0xE1BB, 0xE4C8, 0xEAE1,
    # Offscreen bits
    0xE686, 0xF611, 0xF617, 0xF693,
    # Sound / music engine
    0xF914, 0xF99E, 0xF9DA, 0xF9DF, 0xFB2B, 0xFB5D, 0xFBCB,
]
bank0 = [
    0xB308,  # JSR target missing definition — bank0 explicit for correct suffix
]

# [[replace_func]] — bodies provided by extras.c, recompiler skips emit.
# Dispatch table and call-site references still resolve to func_XXXX_b0,
# which extras.c defines as a thin extern-C shim into semcomp/SmbRoutines.cpp.
[[replace_func]]
bank = 0       # $8000-$BFFF range; default would be fixed_bank=1, which mismatches
addr = 0xBBFE  # GiveOneCoin — semantic impl in smb::semcomp::give_one_coin

# BumpBlock ($BD9B) — DEFERRED. Replacement attempted but the recompiler
# emits its sub-handlers (MushFlowerBlock $BDD2, VineBlock $BDDF, the
# $BB38/$BDD5/$BDD8 entries) as labels INSIDE BumpBlock's body rather
# than as standalone functions. When [[replace_func]] suppresses
# BumpBlock's body, the dispatch table still references the sub-handler
# function symbols — and they're now missing at link time. Either the
# recompiler needs an inner-label "split into separate function" hint,
# or we re-implement the sub-handlers in C++ too. Revisit in a later
# phase; the Blocks class stays in semcomp/ as documentation.

# SetupPowerUp — owned by smb::semcomp::Powerups. Natural caller is
# MushFlowerBlock at $BDD2 (when Mario bumps a power-up brick). Verified
# in-game by hitting a ?-block or brick that contains a power-up.
[[replace_func]]
bank = 0
addr = 0xBC49

# PauseRoutine — owned by smb::semcomp::GameMode::on_pause_tick. Called
# each frame from the natural game-state dispatcher; reads $06FC Start
# button + $0770 OperMode + $0777 PauseTimer, toggles $0776 bit 0 on
# Start press. Verified in-game by pressing Start during gameplay.
# Clean replacement — no external JMP targets into the routine's
# internal labels (ChkPauseTimer / ChkStart / ClrPauseTimer / SetPause /
# ExitPause are all internal-only).
[[replace_func]]
bank = 0
addr = 0x8182

# Phase 6: Score & HUD pipeline.
#
# PrintStatusBarNumbers ($8F06) — owned by Hud::print_status_bar_numbers.
# Refreshes one or two HUD digit fields per call based on the A-register
# "nybbles" control byte. Internally calls $8F11 OutputNumbers which
# remains in the natural-generated code (still emitted as standalone).
[[replace_func]]
bank = 0
addr = 0x8F06

# AddToScore ($BC27) — owned by Hud::add_to_score. The score-grant
# pipeline endpoint: every coin / stomp / brick / fireball-kill / time-
# bonus event calls this after staging DigitModifier[i] values. Calls
# DigitsMathRoutine ($8F5F, not yet owned) + our PrintStatusBarNumbers.
[[replace_func]]
bank = 0
addr = 0xBC27

# Phase 7: Floatey numbers.
#
# SetupFloateyNumber ($DA11, fixed bank) — owned by FloateyNumbers::setup.
# Every points-grant in SMB (stomp / coin-grab / power-up / 1-Up / etc.)
# calls this to spawn the "+N pts" sprite above the source object.
# Per-frame animator ($84C3 FloateyNumbersRoutine) has an inner-label
# issue (separately-emitted $8534 backdoor) — deferred.
[[replace_func]]
addr = 0xDA11

# Phase 8: Enemy AI core.
#
# InitNormalEnemy ($C30E, fixed bank) — owned by Enemies::init_normal_enemy.
# Initial spawn for walking enemies (Goombas, Koopas variants). Picks
# the per-difficulty XSpd from ROM[$C30C..$C30D] and tail-calls
# bounding-box init ($C35A, still natural-generated).
[[replace_func]]
addr = 0xC30E

# MoveNormalEnemy ($CA77, fixed bank) — owned by Enemies::move_normal_enemy.
# Per-frame movement for walkers. State-dispatches into FallE / MEHor /
# SlowM / SteadM / MoveDefeated / ReviveStunned branches based on the
# $001E+slot state byte. Delegates to $BF02 (apply X displacement),
# $BF63 (FallE pre), $CAC8 (ReviveStunned), $CAE5 (MoveDefeatedEnemy)
# — all separately-emitted standalones.
[[replace_func]]
addr = 0xCA77

# Phase 9: Player physics.
#
# AutoControlPlayer ($B0E6) — owned by PlayerPhysics::auto_control.
# Three-byte wrapper: write A to $06FC controller-pressed, then call
# PlayerCtrlRoutine ($B0E9, still natural). Used by scripted-Mario
# states (level entrance, end-level walk, death drop).
[[replace_func]]
bank = 0
addr = 0xB0E6

# PlayerMovementSubs ($B329) — owned by PlayerPhysics::movement_subs.
# Per-frame physics dispatch for Mario. Computes CrouchingFlag, calls
# MovePlayer ($B450, still natural), then switches on Player_State
# into OnGround / JumpSwim / Falling / Climbing sub-handlers (all
# separately-emitted standalones).
[[replace_func]]
bank = 0
addr = 0xB329

# Phase 10: Player animation states.
#
# Four small per-frame routines that PlayerCtrlRoutine ($B0E9) dispatches
# to via the $000E selector. Each is owned by PlayerAnim::*. The helpers
# they delegate to (InitChangeSize $B255, DonePlayerTask $B273,
# CyclePlayerPalette $B288, ResetPalStar $B29A, PlayerCtrlRoutine $B0E9)
# remain natural-generated and are reachable via call_by_address.
[[replace_func]]
bank = 0
addr = 0xB233   # PlayerChangeSize

[[replace_func]]
bank = 0
addr = 0xB245   # PlayerInjuryBlink

[[replace_func]]
bank = 0
addr = 0xB269   # PlayerDeath

[[replace_func]]
bank = 0
addr = 0xB27D   # PlayerFireFlower

# Phase 11 — two small dispatch targets from PlayerMovementSubs.
[[replace_func]]
bank = 0
addr = 0xB35A   # OnGroundStateSub

[[replace_func]]
bank = 0
addr = 0xB36D   # FallingSub

# Phase 12 — JumpSwimSub. Air/swim physics frame. Branch-polarity hazards
# (BPL/BCS/BCC) ported literally; tail-flows into $B3AC LRAir which stays
# natural-generated as func_B3AC_b0.
[[replace_func]]
bank = 0
addr = 0xB376   # JumpSwimSub

# Phase 13 — ClimbingSub. Vine/flagpole climb. Inner labels exist as _b1
# standalones (sound bank), but no _b0 caller reaches the interior, so the
# replacement is safe. Two ROM-table lookups at $B3C7 / $B3CB drive the
# 4-way climb-direction X/Y deltas.
[[replace_func]]
bank = 0
addr = 0xB3CF   # ClimbingSub

# Phase 14 — $B450 PlayerPhysicsSub. Per-frame physics dispatcher.
# Tail-calls $B51C X_Physics (standalone) for the non-climbing path.
[[replace_func]]
bank = 0
addr = 0xB450

# Phase 15 — MovePlayer family. $B200 is trivial. $BF09/$BF4C share a
# body in the generated code (multi-entry); we own both entry points
# (the BF09 port mirrors the body, BF4C is just RTS). $BF4D tail-calls
# $BFAD ImposeGravitySprObj (still natural).
[[replace_func]]
bank = 0
addr = 0xB200

[[replace_func]]
bank = 0
addr = 0xBF09

[[replace_func]]
bank = 0
addr = 0xBF4C

[[replace_func]]
bank = 0
addr = 0xBF4D

