format_version = 1
id = "super-mario-bros.enhancement.voxel-diorama"
version = "1.0.0"
name = "3D Voxel Diorama"
author = "NESRecomp"
description = "Presents Super Mario Bros. as a depth-buffered tabletop without modifying the stock ROM."
license = "MIT"
resolver = "declarative"
save_compatibility = "stock"

[[target]]
game_id = "super-mario-bros-world"
rom_crc32 = "d445f698"

[[feature]]
id = "voxel-diorama"
name = "3D Voxel Diorama"
description = "Raises blocks, pipes, and terrain while reconstructing actors as oriented sprite cards."
group = "Display"
default_enabled = false

[[plugin]]
feature = "voxel-diorama"
id = "super-mario-bros.voxel-diorama"

[[option]]
feature = "voxel-diorama"
id = "pitch"
label = "Camera pitch"
group = "Camera"
type = "integer"
default = 25
min = 5
max = 85
step = 5

[[option]]
feature = "voxel-diorama"
id = "yaw"
label = "Camera yaw"
group = "Camera"
type = "integer"
default = -20
min = -180
max = 180
step = 5

[[option]]
feature = "voxel-diorama"
id = "roll"
label = "Camera roll"
group = "Camera"
type = "integer"
default = 0
min = -45
max = 45
step = 5

[[option]]
feature = "voxel-diorama"
id = "zoom"
label = "Zoom"
group = "Camera"
type = "integer"
default = 100
min = 50
max = 200
step = 5

[[option]]
feature = "voxel-diorama"
id = "sprite-scale"
label = "Sprite scale"
group = "Sprites"
type = "integer"
default = 120
min = 75
max = 250
step = 5
