format_version = 1
id = "super-mario-bros.enhancement.voxel-first-person"
version = "1.0.0"
name = "Voxel 3D"
author = "NESRecomp"
description = "Presents Super Mario Bros. through a player-tracked voxel camera without modifying the stock ROM."
license = "MIT"
resolver = "declarative"
save_compatibility = "stock"

[[target]]
game_id = "super-mario-bros-world"
rom_crc32 = "d445f698"

[[feature]]
id = "voxel-first-person"
name = "Voxel 3D"
description = "Tracks Mario from eye level while reconstructing terrain and non-player actors in perspective."
group = "Display"
exclusive_group = "display-mode"
default_enabled = false

[[plugin]]
feature = "voxel-first-person"
id = "super-mario-bros.voxel-first-person"

[[option]]
feature = "voxel-first-person"
id = "pitch"
label = "Camera pitch"
group = "Camera"
type = "integer"
default = 15
min = 5
max = 85
step = 5

[[option]]
feature = "voxel-first-person"
id = "yaw"
label = "Camera yaw"
group = "Camera"
type = "integer"
default = 0
min = -180
max = 180
step = 5

[[option]]
feature = "voxel-first-person"
id = "roll"
label = "Camera roll"
group = "Camera"
type = "integer"
default = 0
min = -45
max = 45
step = 5

[[option]]
feature = "voxel-first-person"
id = "zoom"
label = "Zoom"
group = "Camera"
type = "integer"
default = 100
min = 50
max = 200
step = 5

[[option]]
feature = "voxel-first-person"
id = "sprite-scale"
label = "Sprite scale"
group = "Sprites"
type = "integer"
default = 120
min = 75
max = 250
step = 5
